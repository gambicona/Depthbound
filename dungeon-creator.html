<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depthbound Dungeon Creator</title>
    <link rel="stylesheet" href="src/styles/main.css" />
    <style>
      body {
        overflow: hidden;
      }

      .creator-shell {
        --creator-cell-size: 22px;
        background: var(--bg);
        color: var(--text);
        display: grid;
        grid-template-columns: 58px 340px minmax(0, 1fr) 380px;
        height: 100vh;
        min-width: 0;
      }

      .creator-shell.left-collapsed {
        grid-template-columns: 58px 0 minmax(0, 1fr) 380px;
      }

      .creator-shell.right-collapsed {
        grid-template-columns: 58px 340px minmax(0, 1fr) 0;
      }

      .creator-shell.left-collapsed.right-collapsed {
        grid-template-columns: 58px 0 minmax(0, 1fr) 0;
      }

      .creator-tool-rail,
      .creator-panel {
        background: color-mix(in srgb, var(--panel) 92%, #000 8%);
        min-height: 0;
      }

      .creator-tool-rail {
        border-right: 1px solid var(--line);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
        padding: 8px 7px;
      }

      .creator-rail-mark {
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 900;
        letter-spacing: 0.04em;
        padding: 8px 0 10px;
        text-align: center;
      }

      .tool-grid {
        align-content: start;
        display: grid;
        gap: 7px;
      }

      .tool-grid button,
      .creator-rail-toggle {
        align-items: center;
        aspect-ratio: 1;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        display: inline-flex;
        font-size: 0.68rem;
        font-weight: 900;
        justify-content: center;
        line-height: 1;
        padding: 0;
        width: 100%;
      }

      .tool-grid button.active,
      .creator-rail-toggle.active {
        background: rgba(215, 168, 79, 0.16);
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
        color: #fff3d0;
      }

      .creator-panel {
        border-right: 1px solid var(--line);
        display: grid;
        grid-template-rows: auto auto 1fr;
        overflow: hidden;
      }

      .creator-panel.right {
        border-left: 1px solid var(--line);
        border-right: 0;
        grid-template-rows: auto 1fr;
      }

      .creator-shell.left-collapsed .creator-panel.left,
      .creator-shell.right-collapsed .creator-panel.right {
        border: 0;
        overflow: hidden;
      }

      .creator-panel-header {
        align-items: center;
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 8px;
        justify-content: space-between;
        min-width: 0;
        padding: 11px 12px;
      }

      .creator-panel-header h2 {
        font-size: 0.9rem;
        margin: 0;
      }

      .creator-panel-close {
        min-height: 30px;
        padding: 4px 8px;
      }

      .creator-panel-tabs,
      .creator-asset-tabs {
        border-bottom: 1px solid var(--line);
        display: flex;
        gap: 5px;
        overflow-x: auto;
        padding: 8px 10px;
      }

      .creator-panel-tabs button,
      .creator-asset-tabs button {
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        flex: 0 0 auto;
        font-size: 0.74rem;
        font-weight: 900;
        min-height: 30px;
        padding: 5px 9px;
      }

      .creator-panel-tabs button.active,
      .creator-asset-tabs button.active {
        border-color: var(--accent);
        color: var(--text);
      }

      .creator-panel-body {
        min-height: 0;
        overflow: auto;
        padding: 12px;
      }

      .creator-panel-page,
      .creator-asset-page {
        display: none;
      }

      .creator-panel-page.active,
      .creator-asset-page.active {
        display: grid;
        gap: 12px;
      }

      .creator-stage {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }

      .creator-topbar {
        align-items: center;
        background: var(--panel2);
        border-bottom: 1px solid var(--line);
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(0, 1fr) auto;
        padding: 10px 14px;
      }

      .creator-topbar h1 {
        font-size: 0.98rem;
        margin: 0;
      }

      .creator-command-title {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        min-width: 0;
      }

      .creator-command-title h1 {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .creator-chip {
        align-items: center;
        background: rgba(255, 255, 255, 0.055);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        display: inline-flex;
        font-size: 0.72rem;
        font-weight: 900;
        gap: 5px;
        min-height: 28px;
        padding: 4px 8px;
      }

      .creator-command-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        justify-content: flex-end;
      }

      .creator-command-actions button,
      .creator-command-actions a {
        min-height: 32px;
        padding: 5px 9px;
      }

      .creator-grid-wrap {
        background: radial-gradient(circle at center, rgba(255, 255, 255, 0.025), transparent 55%), #08090b;
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 20px;
        position: relative;
      }

      .creator-grid {
        background: #08090b;
        border: 1px solid var(--line);
        display: grid;
        gap: 1px;
        width: max-content;
      }

      .creator-map-controls {
        display: flex;
        gap: 6px;
        position: sticky;
        left: 0;
        top: 0;
        width: max-content;
        z-index: 5;
      }

      .creator-map-controls button {
        background: rgba(10, 12, 15, 0.92);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        font-weight: 900;
        min-height: 30px;
        min-width: 34px;
        padding: 4px 8px;
      }

      .creator-cell {
        align-items: center;
        background: #111317;
        border: 0;
        color: var(--muted);
        display: flex;
        font-size: 0.58rem;
        font-weight: 900;
        height: var(--creator-cell-size);
        justify-content: center;
        min-height: var(--creator-cell-size);
        padding: 0;
        position: relative;
        width: var(--creator-cell-size);
      }

      .creator-cell .creator-cell-object-icon {
        height: calc(var(--creator-cell-size) - 2px);
        inset: 1px;
        object-fit: contain;
        pointer-events: none;
        position: absolute;
        width: calc(var(--creator-cell-size) - 2px);
      }

      .creator-cell.axis-x::before,
      .creator-cell.axis-y::after {
        color: rgba(255, 255, 255, 0.42);
        font-size: 0.46rem;
        font-weight: 800;
        position: absolute;
      }

      .creator-cell.axis-x::before {
        content: attr(data-axis-x);
        top: 1px;
      }

      .creator-cell.axis-y::after {
        content: attr(data-axis-y);
        left: 1px;
        bottom: 1px;
      }

      .creator-cell.room {
        background: #2d2928;
      }

      .creator-cell.corridor {
        background: #1f2425;
      }

      .creator-cell.door {
        box-shadow: inset 0 0 0 2px rgba(215, 168, 79, 0.72);
      }

      .creator-cell.hidden-door {
        box-shadow: inset 0 0 0 2px rgba(98, 206, 178, 0.86), inset 0 0 14px rgba(98, 206, 178, 0.2);
        color: #bfffee;
      }

      .creator-cell.exit {
        background: #315d3a;
      }

      .creator-cell.start {
        background: #36536f;
        box-shadow: inset 0 0 0 2px rgba(134, 211, 255, 0.72);
        color: #d8f2ff;
      }

      .creator-cell.portal {
        background: #25315f;
      }

      .creator-cell.object-water-floor {
        background: linear-gradient(135deg, rgba(75, 161, 204, 0.62), rgba(24, 74, 116, 0.78)), #1f2425;
        color: #d8f6ff;
      }

      .creator-cell.object-lava-floor {
        background: linear-gradient(135deg, rgba(255, 174, 31, 0.68), rgba(159, 35, 16, 0.82)), #28130e;
        color: #fff0bc;
      }

      .creator-cell.object-acid-floor {
        background: linear-gradient(135deg, rgba(189, 255, 58, 0.72), rgba(26, 132, 49, 0.84)), #102714;
        color: #f0ffd0;
      }

      .creator-cell.object-healing-pool-floor {
        background: linear-gradient(135deg, rgba(255, 190, 213, 0.7), rgba(176, 57, 118, 0.82)), #2b1420;
        color: #fff4f8;
      }

      .creator-cell.selected-room {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }

      .room-move-controls {
        display: grid;
        gap: 6px;
        grid-template-columns: repeat(3, 1fr);
        margin-top: 8px;
      }

      .room-move-controls button {
        min-height: 32px;
        padding: 4px 6px;
      }

      .creator-cell:hover {
        filter: brightness(1.25);
      }

      .creator-form,
      .creator-section {
        display: grid;
        gap: 8px;
        margin: 0;
      }

      .creator-section {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        padding-bottom: 12px;
      }

      .creator-section:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      .creator-section h2,
      .creator-section h3 {
        font-size: 0.86rem;
        margin: 0 0 2px;
      }

      .creator-form label,
      .creator-section label {
        color: var(--muted);
        display: grid;
        font-size: 0.78rem;
        font-weight: 800;
        gap: 4px;
      }

      .creator-form input,
      .creator-form select,
      .creator-form textarea,
      .creator-section input,
      .creator-section select,
      .creator-section textarea {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        padding: 7px 8px;
      }

      .creator-form textarea,
      .creator-section textarea {
        min-height: 110px;
        resize: vertical;
      }

      .creator-row {
        display: grid;
        gap: 8px;
        grid-template-columns: 1fr 1fr;
      }

      .creator-section a.ghost-button {
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        display: inline-flex;
        font-size: 0.78rem;
        font-weight: 900;
        justify-content: center;
        min-height: 36px;
        padding: 7px 8px;
        text-align: center;
        text-decoration: none;
      }

      .creator-filter-grid {
        display: grid;
        gap: 6px;
        grid-template-columns: 1fr 1fr;
      }

      .catalogue {
        display: grid;
        gap: 6px;
        max-height: min(42vh, 360px);
        overflow: auto;
      }

      .catalogue button {
        align-items: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--text);
        display: block;
        line-height: 1.16;
        min-width: 0;
        min-height: 44px;
        padding: 7px 8px;
        text-align: left;
        width: 100%;
      }

      .catalogue b,
      .catalogue .small-note {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .catalogue .furniture-catalogue-button {
        align-items: center;
        display: grid;
        gap: 8px;
        grid-template-columns: 32px minmax(0, 1fr);
      }

      .furniture-catalogue-copy {
        display: grid;
        gap: 2px;
        min-width: 0;
      }

      .catalogue .monster-catalogue-button {
        display: grid;
        gap: 2px;
      }

      .monster-catalogue-title {
        align-items: center;
        display: flex;
        gap: 7px;
        min-width: 0;
      }

      .monster-catalogue-title b {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .monster-category-badge {
        align-items: center;
        background: rgba(248, 237, 218, 0.13);
        border: 1px solid rgba(248, 237, 218, 0.34);
        border-radius: 5px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        color: #fff5df;
        display: inline-flex;
        flex: 0 0 auto;
        font-size: 0.68rem;
        font-weight: 900;
        justify-content: center;
        line-height: 1;
        padding: 2px 5px;
      }

      .furniture-catalogue-icon {
        align-items: center;
        background: rgba(0, 0, 0, 0.22);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        display: flex;
        font-size: 0.68rem;
        font-weight: 900;
        height: 32px;
        justify-content: center;
        min-height: 32px;
        min-width: 32px;
        overflow: hidden;
        width: 32px;
      }

      .furniture-catalogue-icon img {
        height: 30px;
        object-fit: contain;
        width: 30px;
      }

      .catalogue button.active {
        border-color: var(--accent);
      }

      .selected-card {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
      }

      .small-note {
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;
      }

      .creator-list {
        display: grid;
        gap: 7px;
      }

      .creator-list-item {
        align-items: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--line);
        border-radius: 6px;
        display: grid;
        gap: 6px;
        grid-template-columns: 1fr auto;
        padding: 8px;
      }

      .creator-status {
        color: var(--accent);
        font-size: 0.78rem;
        min-height: 1.2em;
      }

      .creator-checklist {
        display: grid;
        gap: 6px;
      }

      .creator-checklist div {
        align-items: center;
        background: rgba(255, 255, 255, 0.035);
        border: 1px solid var(--line);
        border-radius: 6px;
        color: var(--muted);
        display: flex;
        font-size: 0.76rem;
        font-weight: 800;
        justify-content: space-between;
        min-height: 30px;
        padding: 5px 8px;
      }

      .creator-checklist div.ready {
        border-color: rgba(111, 190, 132, 0.55);
        color: #d7f4db;
      }

      .creator-checklist div.warn {
        border-color: rgba(215, 168, 79, 0.55);
        color: #ffe4ab;
      }

      .creator-empty-state {
        border: 1px dashed var(--line);
        border-radius: 6px;
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.45;
        padding: 12px;
      }

      @media (max-width: 1100px) {
        .creator-shell,
        .creator-shell.left-collapsed,
        .creator-shell.right-collapsed,
        .creator-shell.left-collapsed.right-collapsed {
          grid-template-columns: 52px minmax(0, 1fr);
          grid-template-rows: minmax(0, 1fr) auto;
        }

        .creator-tool-rail {
          grid-row: 1 / 3;
        }

        .creator-panel {
          bottom: 0;
          box-shadow: 0 -16px 34px rgba(0, 0, 0, 0.32);
          display: none;
          grid-column: 2;
          grid-row: 2;
          max-height: 58vh;
          z-index: 20;
        }

        .creator-panel.left:not(.hidden-mobile),
        .creator-panel.right:not(.hidden-mobile) {
          display: grid;
        }

        .creator-stage {
          grid-column: 2;
          grid-row: 1 / 3;
        }

        .creator-topbar {
          align-items: start;
          grid-template-columns: 1fr;
        }

        .creator-command-actions {
          justify-content: start;
        }
      }
    </style>
  </head>
  <body>
    <main class="creator-shell" id="creator-shell">
      <nav class="creator-tool-rail" aria-label="Creator tools">
        <div class="creator-rail-mark">DB</div>
        <div class="tool-grid" id="tool-grid">
          <button type="button" data-tool="select" title="Select / Edit" aria-label="Select / Edit">SEL</button>
          <button type="button" data-tool="connect" title="Connect Rooms" aria-label="Connect Rooms">CON</button>
          <button type="button" data-tool="hallway" title="Draw Hallway" aria-label="Draw Hallway">HAL</button>
          <button type="button" data-tool="furniture" title="Place Furniture" aria-label="Place Furniture">FUR</button>
          <button type="button" data-tool="trap" title="Place Trap" aria-label="Place Trap">TRP</button>
          <button type="button" data-tool="monster" title="Place Monster" aria-label="Place Monster">MON</button>
          <button type="button" data-tool="start" title="Set Party Start" aria-label="Set Party Start">STA</button>
          <button type="button" data-tool="exit" title="Set Exit" aria-label="Set Exit">EXT</button>
          <button type="button" data-tool="portal" title="Linked Portals" aria-label="Linked Portals">POR</button>
          <button type="button" data-tool="erase" title="Erase" aria-label="Erase">DEL</button>
        </div>
        <div class="tool-grid">
          <button class="creator-rail-toggle active" type="button" data-toggle-panel="left" title="Toggle build drawer" aria-label="Toggle build drawer">L</button>
          <button class="creator-rail-toggle active" type="button" data-toggle-panel="right" title="Toggle inspector drawer" aria-label="Toggle inspector drawer">R</button>
        </div>
      </nav>

      <aside class="creator-panel left" id="creator-left-panel">
        <div class="creator-panel-header">
          <h2>Dungeon Setup</h2>
          <button class="creator-panel-close ghost-button" type="button" data-toggle-panel="left">Close</button>
        </div>
        <div class="creator-panel-tabs" role="tablist" aria-label="Creator sections">
          <button class="active" type="button" data-panel-tab="build">Build</button>
          <button type="button" data-panel-tab="story">Story</button>
          <button type="button" data-panel-tab="goals">Goals</button>
          <button type="button" data-panel-tab="save">Save</button>
        </div>
        <div class="creator-panel-body">
          <div class="creator-panel-page active" data-panel-page="build">
            <section class="creator-section">
              <h2>Dungeon</h2>
              <label>
                Name
                <input id="creator-name" value="Custom Dungeon" />
              </label>
              <label>
                Theme
                <select id="creator-theme"></select>
              </label>
              <label>
                Grid size
                <input id="creator-grid-size" type="number" min="16" max="72" value="36" />
              </label>
              <button id="new-dungeon" type="button">New Blank Dungeon</button>
              <div id="random-layout-controls" class="creator-section">
                <h3>Random Layout</h3>
                <div class="creator-row">
                  <label>
                    Rooms
                    <input id="random-room-count" type="number" min="1" max="80" value="10" />
                  </label>
                  <label>
                    Hallway width
                    <input id="hallway-width" type="range" min="1" max="3" value="1" />
                    <span id="hallway-width-label" class="small-note">1 square</span>
                  </label>
                </div>
                <button id="random-layout" type="button">Random Layout</button>
              </div>
            </section>

            <section class="creator-section">
              <h2>Add Room</h2>
              <div class="creator-row">
                <label>X <input id="room-x" type="number" value="3" /></label>
                <label>Y <input id="room-y" type="number" value="3" /></label>
              </div>
              <div class="creator-row">
                <label>Width <input id="room-w" type="number" min="3" value="7" /></label>
                <label>Height <input id="room-h" type="number" min="3" value="6" /></label>
              </div>
              <label>
                Room name
                <input id="room-name" value="Dungeon Room" />
              </label>
              <button id="add-room" type="button">Add Room</button>
            </section>

            <section class="creator-section">
              <h2>Rooms</h2>
              <div id="room-list" class="creator-list"></div>
            </section>
          </div>

          <div class="creator-panel-page" data-panel-page="story">
            <section class="creator-section">
              <h2>Story</h2>
              <label>
                Intro text
                <textarea id="intro-text" placeholder="What the party sees before entering..."></textarea>
              </label>
              <label>
                Intro image URLs
                <textarea id="intro-images" placeholder="One image URL per line"></textarea>
              </label>
              <label>
                Outro text
                <textarea id="outro-text" placeholder="What appears after victory..."></textarea>
              </label>
              <label>
                Outro image URLs
                <textarea id="outro-images" placeholder="One image URL per line"></textarea>
              </label>
            </section>

            <section class="creator-section">
              <h2>Story Triggers</h2>
              <label>
                Trigger
                <select id="story-trigger-event">
                  <option value="enterRoom">Walk into room</option>
                  <option value="inspectObject">Inspect furniture/object</option>
                  <option value="openObject">Open/loot chest or object</option>
                  <option value="killMonster">Kill monster</option>
                </select>
              </label>
              <label>
                Target
                <select id="story-trigger-target"></select>
              </label>
              <label>
                Title
                <input id="story-trigger-title" placeholder="Optional scene title" />
              </label>
              <label>
                Text
                <textarea id="story-trigger-text" placeholder="Narration to show when this trigger fires"></textarea>
              </label>
              <label>
                Image URLs
                <textarea id="story-trigger-images" placeholder="One image URL per line"></textarea>
              </label>
              <label>
                <input id="story-trigger-once" type="checkbox" checked />
                Show only once
              </label>
              <button id="save-story-trigger" type="button">Add Story Trigger</button>
              <button id="new-story-trigger" class="ghost-button" type="button">New Trigger</button>
              <div id="story-trigger-list" class="creator-list"></div>
            </section>
          </div>

          <div class="creator-panel-page" data-panel-page="goals">
            <section class="creator-section">
              <h2>Goal</h2>
              <label>
                Completion condition
                <select id="goal-type">
                  <option value="reachExit">Reach the exit</option>
                  <option value="collectItem">Collect specific item</option>
                  <option value="collectItemCount">Collect X of a specific item</option>
                  <option value="killBoss">Kill boss monster</option>
                  <option value="killMonsterType">Kill X monsters of a type</option>
                  <option value="escortNpc">Escort NPC to exit (reserved)</option>
                </select>
              </label>
              <label>
                Goal item
                <select id="goal-item"></select>
              </label>
              <label>
                Goal monster
                <select id="goal-monster"></select>
              </label>
              <label>
                Count
                <input id="goal-count" type="number" min="1" value="1" />
              </label>
              <label>
                <input id="goal-consume-item" type="checkbox" />
                Remove collected goal item from inventory on completion
              </label>
            </section>
          </div>

          <div class="creator-panel-page" data-panel-page="save">
            <section class="creator-section">
              <h2>Saved Custom Dungeons</h2>
              <div id="saved-dungeons" class="creator-list"></div>
              <button id="save-dungeon" type="button">Save Dungeon For Game</button>
              <button id="calc-xp" type="button" class="ghost-button">Calc XP</button>
              <p id="creator-status" class="creator-status"></p>
            </section>

            <section class="creator-section">
              <h2>Campaign Dungeons</h2>
              <div id="campaign-dungeons" class="creator-list"></div>
              <button id="save-campaign-override" type="button" class="ghost-button" disabled>Save Campaign Override</button>
            </section>

            <section class="creator-section">
              <h2>Import / Export</h2>
              <textarea id="export-json" spellcheck="false"></textarea>
              <button id="copy-json" type="button">Refresh Export JSON</button>
              <button id="import-json" class="ghost-button" type="button">Import JSON</button>
            </section>
          </div>
        </div>

                  </select>
                </label>
              </div>

            </div>

            <div class="creator-asset-page" data-asset-page="items">

              <div class="creator-filter-grid">
                <label>
                  Type

                </label>
                <label>
                  Tag
                  <select id="item-tag-filter"></select>
                </label>
                <label>
                  Sort
                  <select id="item-sort">
                    <option value="name">Name</option>
                    <option value="value">Value</option>
                    <option value="type">Type</option>
                    <option value="id">ID</option>
                  </select>
                </label>
              </div>
              <label>
                Add loot item
                <select id="loot-item"></select>
              </label>
              <div id="custom-bibliography-items" class="catalogue custom-bibliography-items"></div>
              <button id="add-loot" type="button">Add Loot To Selected</button>
              <button id="delete-selected" class="ghost-button" type="button">Delete Selected</button>
            </div>

            <div class="creator-asset-page" data-asset-page="create">
              <label>
                Template item

              </label>
              <label>Name / Title <input id="custom-item-name" /></label>
              <label>Description / Formatted Text <textarea id="custom-item-description"></textarea></label>
              <label>Journal categories <input id="custom-item-tags" placeholder="Promiscuous" /></label>
              <label>
                <input id="custom-item-temporary" type="checkbox" />

              </label>
              <div class="creator-row">
                <label>Type <input id="custom-item-type" /></label>
                <label>Weight lb <input id="custom-item-weight" type="number" step="0.1" /></label>
              </div>
              <label>Gold value <input id="custom-item-value" type="number" min="0" step="0.01" /></label>
              <div class="creator-row">
                <button id="create-custom-item" type="button">Create Local Item</button>
                <a class="ghost-button" href="custom-item-creator.html">Open Custom Item Creator</a>
              </div>
            </div>
          </section>
        </div>
