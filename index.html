<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Depthbound</title>
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <section id="main-menu" class="main-menu" aria-label="Main menu">
      <div class="menu-panel">
        <p class="eyebrow">Dungeon crawler</p>
        <h1>Depthbound</h1>
        <div class="menu-actions">
          <button id="start-adventure" type="button">Start New Adventure</button>
          <button id="choose-save-folder" class="ghost-button" type="button">Choose Save Folder</button>
          <a class="ghost-button" href="dungeon-creator.html">Dungeon Creator</a>
          <button id="main-tutorial" class="ghost-button" type="button">Tutorial</button>
        </div>
        <div id="save-slots" class="save-slots" aria-label="Save slots"></div>
        <p id="save-status" class="save-status"></p>
      </div>
    </section>

    <main class="app-shell">
      <section class="arena" aria-label="Dungeon room">
        <div class="topbar">
          <div>
            <p class="eyebrow">Depthbound</p>
            <h1 id="room-title">Old Guardroom</h1>
            <button id="show-dungeon-intro" class="ghost-button dungeon-intro-button hidden" type="button">Intro</button>
          </div>
          <div class="top-actions">
            <div class="zoom-controls" aria-label="Dungeon zoom controls">
              <button id="zoom-out" class="icon-button ghost-button" type="button" title="Zoom out" aria-label="Zoom out">-</button>
              <span id="zoom-label">100%</span>
              <button id="zoom-in" class="icon-button ghost-button" type="button" title="Zoom in" aria-label="Zoom in">+</button>
            </div>
            <label class="volume-controls" aria-label="Sound volume">
              <span class="volume-text">Volume</span>
              <span id="volume-label">50%</span>
              <input id="volume-slider" type="range" min="0" max="100" step="1" value="50" />
            </label>
            <button id="toggle-admin-mode" class="ghost-button admin-mode-button" type="button">Adminmode</button>
            <button id="toggle-layout" class="ghost-button debug-button" type="button">Show Dungeon Layout</button>
            <button id="debug-kill" class="ghost-button debug-button" type="button">Kill all visible Monsters</button>
            <button id="save-game" class="ghost-button" type="button">Save</button>
            <button id="new-game" class="ghost-button" type="button">Main Menu</button>
            <button id="tutorial" class="ghost-button" type="button">Tutorial</button>
          </div>
        </div>
        <div class="room-scroll">
          <div class="room-wrap">
            <div id="room" class="room" aria-label="Tactical grid"></div>
          </div>
        </div>
      </section>

      <aside class="side-panel" aria-label="Character and combat state">
        <section class="status-panel">
          <div class="combat-state">
            <span id="round-label">Round 0</span>
            <strong id="turn-label">Roll initiative to begin</strong>
          </div>
          <div id="initiative-list" class="initiative-list"></div>
        </section>

        <section class="fighters">
          <article id="hero-card" class="fighter-card"></article>
        </section>

        <section class="level-panel">
          <button id="level-up" type="button" disabled>Level Up</button>
        </section>

        <section class="log-panel">
          <div class="panel-heading">
            <h2>Combat Log</h2>
            <button id="clear-log" class="icon-button" type="button" title="Clear log" aria-label="Clear log">x</button>
          </div>
          <ol id="combat-log" class="combat-log" aria-live="polite"></ol>
        </section>
      </aside>
    </main>

    <nav class="action-dock" aria-label="Combat actions">
      <button id="roll-initiative" type="button">Roll Initiative [R]</button>
      <button id="select-party" type="button" disabled>Select Party [Q]</button>
      <div class="dock-action">
        <button id="attack" type="button" disabled>
          <span>Attack [T]</span>
          <small id="attack-note">No target</small>
        </button>
      </div>
      <div class="dock-action">
        <button id="action-button" type="button" disabled>Other [X]</button>
      </div>
      <button id="use-item" type="button" disabled>Use Item [U]</button>
      <button id="abilities" type="button" disabled>Abilities [B]</button>
      <button id="short-rest" type="button" disabled>Short Rest</button>
      <button id="return-home" type="button" disabled>Return Home [H]</button>
      <button id="end-turn" type="button" disabled>End Turn [E]</button>
    </nav>

    <div id="fighter-info" class="fighter-info hidden" role="dialog" aria-modal="true" aria-labelledby="fighter-info-name">
      <div class="fighter-info-panel">
        <div class="panel-heading">
          <h2 id="fighter-info-name">Fighter</h2>
          <button id="close-fighter-info" class="icon-button" type="button" title="Close" aria-label="Close">x</button>
        </div>
        <div id="fighter-info-body" class="fighter-info-body"></div>
      </div>
    </div>

    <div id="inventory-menu" class="fighter-info hidden" role="dialog" aria-modal="true" aria-labelledby="inventory-title">
      <div class="fighter-info-panel inventory-panel">
        <div class="panel-heading">
          <h2 id="inventory-title">Inventory</h2>
          <button id="close-inventory" class="icon-button" type="button" title="Close" aria-label="Close">x</button>
        </div>
        <div id="inventory-body" class="fighter-info-body"></div>
      </div>
    </div>

    <div id="use-item-menu" class="fighter-info hidden" role="dialog" aria-modal="true" aria-labelledby="use-item-title">
      <div class="fighter-info-panel">
        <div class="panel-heading">
          <h2 id="use-item-title">Use Item</h2>
          <button id="close-use-item" class="icon-button" type="button" title="Close" aria-label="Close">x</button>
        </div>
        <div id="use-item-body" class="fighter-info-body"></div>
      </div>
    </div>

    <div id="action-menu" class="fighter-info hidden" role="dialog" aria-modal="true" aria-labelledby="action-menu-title">
      <div class="fighter-info-panel">
        <div class="panel-heading">
          <h2 id="action-menu-title">Other</h2>
          <button id="close-action-menu" class="icon-button" type="button" title="Close" aria-label="Close">x</button>
        </div>
        <div id="action-menu-body" class="fighter-info-body"></div>
      </div>
    </div>

    <div id="abilities-menu" class="fighter-info hidden" role="dialog" aria-modal="true" aria-labelledby="abilities-title">
      <div class="fighter-info-panel">
        <div class="panel-heading">
          <h2 id="abilities-title">Abilities</h2>
          <button id="close-abilities" class="icon-button" type="button" title="Close" aria-label="Close">x</button>
        </div>
        <div id="abilities-body" class="fighter-info-body"></div>
      </div>
    </div>

    <div id="home-menu" class="fighter-info hidden" role="dialog" aria-modal="true" aria-labelledby="home-menu-title">
      <div class="fighter-info-panel">
        <div class="panel-heading">
          <h2 id="home-menu-title">Home Door</h2>
          <button id="close-home-menu" class="icon-button" type="button" title="Close" aria-label="Close">x</button>
        </div>
        <div class="fighter-info-body home-actions">
          <button id="go-store" type="button">General Merchant</button>
          <hr />
          <button id="go-new-dungeon" type="button">Random Dungeon</button>
          <hr />
          <button id="go-barrow-crown" type="button"><span>The Barrow Crown</span><small data-campaign-progress>0/7</small></button>
          <button id="go-thornwood-pact" type="button"><span>The Thornwood Pact</span><small data-campaign-progress>0/8</small></button>
        </div>
      </div>
    </div>

    <div id="store-menu" class="fighter-info hidden" role="dialog" aria-modal="true" aria-labelledby="store-title">
      <div class="fighter-info-panel store-panel">
        <div class="panel-heading">
          <h2 id="store-title">Store</h2>
          <button id="close-store" class="icon-button" type="button" title="Close" aria-label="Close">x</button>
        </div>
        <div id="store-body" class="fighter-info-body"></div>
      </div>
    </div>

    <div id="game-dialog" class="fighter-info hidden" role="dialog" aria-modal="true" aria-labelledby="game-dialog-title">
      <form id="game-dialog-form" class="fighter-info-panel dialog-panel">
        <div class="panel-heading">
          <h2 id="game-dialog-title">Dialog</h2>
        </div>
        <div class="fighter-info-body">
          <p id="game-dialog-message" class="dialog-message"></p>
          <label id="game-dialog-field" class="dialog-field hidden">
            <span id="game-dialog-label">Name</span>
            <input id="game-dialog-input" type="text" autocomplete="off" />
          </label>
          <div id="game-dialog-actions" class="dialog-actions"></div>
        </div>
      </form>
    </div>

    <div id="tutorial-tour" class="tutorial-tour hidden" aria-live="polite">
      <div id="tutorial-highlight" class="tutorial-highlight hidden"></div>
      <section class="tutorial-tour-card" aria-label="Interactive tutorial">
        <p id="tutorial-tour-step" class="eyebrow">Tutorial</p>
        <h2 id="tutorial-tour-title">Tour</h2>
        <p id="tutorial-tour-body"></p>
        <div class="tutorial-tour-actions">
          <button id="tutorial-tour-back" class="ghost-button" type="button">Back</button>
          <button id="tutorial-tour-next" type="button">Next</button>
          <button id="tutorial-tour-close" class="ghost-button" type="button">Finish</button>
        </div>
      </section>
    </div>

    <script src="src/scripts/config.js" defer></script>
    <script src="src/scripts/content/registry.js" defer></script>
    <script src="src/scripts/content/items/equipment.js" defer></script>
    <script src="src/scripts/content/items/treasure.js" defer></script>
    <script src="src/scripts/content/items/magic_items.js" defer></script>
    <script src="src/scripts/content/items/magic_accessories.js" defer></script>
    <script src="src/scripts/content/spells/core-spells.js" defer></script>
    <script src="src/scripts/content/classes/barbarian.js" defer></script>
    <script src="src/scripts/content/classes/fighter.js" defer></script>
    <script src="src/scripts/content/classes/monk.js" defer></script>
    <script src="src/scripts/content/classes/rogue.js" defer></script>
    <script src="src/scripts/content/classes/cleric.js" defer></script>
    <script src="src/scripts/content/classes/druid.js" defer></script>
    <script src="src/scripts/content/classes/wizard.js" defer></script>
    <script src="src/scripts/content/classes/bard.js" defer></script>
    <script src="src/scripts/content/classes/sorcerer.js" defer></script>
    <script src="src/scripts/content/classes/paladin.js" defer></script>
    <script src="src/scripts/content/classes/ranger.js" defer></script>
    <script src="src/scripts/content/classes/warlock.js" defer></script>
    <script src="src/scripts/content/monsters/skeletal-undead-pack.js" defer></script>
    <script src="src/scripts/content/monsters/zombie-undead-pack.js" defer></script>
    <script src="src/scripts/content/monsters/forest-beast-pack.js" defer></script>
    <script src="src/scripts/content/monsters/beast-biome-pack.js" defer></script>
    <script src="src/scripts/content/furniture/dungeon-furniture-pack.js" defer></script>
    <script src="src/scripts/content/traps/chest-traps.js" defer></script>
    <script src="src/scripts/content/dungeons/generated-old-guardroom.js" defer></script>
    <script src="src/scripts/content/loot/basic-dungeon.js" defer></script>
    <script src="src/scripts/content/themes/old-guardroom.js" defer></script>
    <script src="src/scripts/content/themes/forest-of-the-beasts.js" defer></script>
    <script src="src/scripts/dice.js" defer></script>
    <script src="src/scripts/grid.js" defer></script>
    <script src="src/scripts/dungeon.js" defer></script>
    <script src="src/scripts/custom-dungeons.js" defer></script>
    <script src="src/scripts/campaigns.js" defer></script>
    <script src="src/scripts/save.js" defer></script>
    <script src="src/scripts/app/bootstrap.js" defer></script>
    <script src="src/scripts/app/game-state.js" defer></script>
    <script src="src/scripts/app/ui-dialogs-character.js" defer></script>
    <script src="src/scripts/app/combat-map.js" defer></script>
    <script src="src/scripts/app/movement-ai-input.js" defer></script>
    <script src="src/scripts/app/rendering-inventory.js" defer></script>
    <script src="src/scripts/app.js" defer></script>
  </body>
</html>
