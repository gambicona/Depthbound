<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Room Prototype</title>
    <link rel="stylesheet" href="src/styles/main.css" />
  </head>
  <body>
    <section id="main-menu" class="main-menu" aria-label="Main menu">
      <div class="menu-panel">
        <p class="eyebrow">Dungeon crawler</p>
        <h1>Old Guardroom</h1>
        <div class="menu-actions">
          <button id="start-adventure" type="button">Start New Adventure</button>
        </div>
        <div id="save-slots" class="save-slots" aria-label="Save slots"></div>
        <p id="save-status" class="save-status"></p>
      </div>
    </section>

    <main class="app-shell">
      <section class="arena" aria-label="Dungeon room">
        <div class="topbar">
          <div>
            <p class="eyebrow">D&D-like crawler prototype</p>
            <h1>Old Guardroom</h1>
          </div>
          <div class="top-actions">
            <button id="toggle-layout" class="ghost-button" type="button">Show Dungeon Layout</button>
            <button id="debug-kill" class="ghost-button debug-button" type="button">Debug Kill Monsters</button>
            <button id="save-game" class="ghost-button" type="button">Save</button>
            <button id="new-game" class="ghost-button" type="button">Main Menu</button>
          </div>
        </div>
        <div class="room-scroll">
          <div class="room-wrap">
            <div id="room" class="room" aria-label="Tactical grid"></div>
          </div>
        </div>
      </section>

      <aside class="side-panel" aria-label="Character and combat state">
        <section class="status-panel">
          <div class="combat-state">
            <span id="round-label">Round 0</span>
            <strong id="turn-label">Roll initiative to begin</strong>
          </div>
          <div id="initiative-list" class="initiative-list"></div>
        </section>

        <section class="fighters">
          <article id="hero-card" class="fighter-card"></article>
          <article id="monster-card" class="fighter-card"></article>
        </section>

        <section class="log-panel">
          <div class="panel-heading">
            <h2>Combat Log</h2>
            <button id="clear-log" class="icon-button" type="button" title="Clear log" aria-label="Clear log">x</button>
          </div>
          <ol id="combat-log" class="combat-log" aria-live="polite"></ol>
        </section>
      </aside>
    </main>

    <nav class="action-dock" aria-label="Combat actions">
      <button id="roll-initiative" type="button">Roll Initiative</button>
      <button id="attack" type="button" disabled>Attack</button>
      <button id="end-turn" type="button" disabled>End Turn</button>
    </nav>

    <script src="src/scripts/config.js" defer></script>
    <script src="src/scripts/dice.js" defer></script>
    <script src="src/scripts/grid.js" defer></script>
    <script src="src/scripts/dungeon.js" defer></script>
    <script src="src/scripts/save.js" defer></script>
    <script src="src/scripts/app.js" defer></script>
  </body>
</html>
